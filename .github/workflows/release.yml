name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebase onto latest main
        run: |
          git fetch origin main
          git rebase origin/main

      - name: Bump version
        id: version
        run: |
          current=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml)
          name=${current%%+*}
          build=${current##*+}
          IFS=. read -r major minor patch <<< "$name"

          before="${{ github.event.before }}"
          if [[ "$before" =~ ^0+$ ]] || ! git cat-file -e "$before" 2>/dev/null; then
            range="HEAD~1..HEAD"
          else
            range="$before..HEAD"
          fi
          messages=$(git log "$range" --format='%s%n%b')

          if grep -qE '^[a-z]+(\([^)]*\))?!:|BREAKING CHANGE' <<< "$messages"; then
            major=$((major + 1)); minor=0; patch=0
          elif grep -qE '^feat(\([^)]*\))?:' <<< "$messages"; then
            minor=$((minor + 1)); patch=0
          else
            patch=$((patch + 1))
          fi
          build=$((build + 1))

          new_name="$major.$minor.$patch"
          sed -i -E "s/^version:.*/version: $new_name+$build/" pubspec.yaml

          echo "name=$new_name" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "tag=v$new_name" >> "$GITHUB_OUTPUT"
          echo "Version: $current -> $new_name+$build"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          : "${KEYSTORE_BASE64:?Set the ANDROID_KEYSTORE_BASE64 repository secret}"
          : "${KEYSTORE_PASSWORD:?Set the ANDROID_KEYSTORE_PASSWORD repository secret}"
          : "${KEY_ALIAS:?Set the ANDROID_KEY_ALIAS repository secret}"
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<PROPS
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          PROPS

      - run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk "voip_app-${{ steps.version.outputs.tag }}.apk"

      - name: Commit version and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "chore(release): ${{ steps.version.outputs.tag }} [skip ci]"
          git tag "${{ steps.version.outputs.tag }}"
          git push --atomic origin HEAD:main "refs/tags/${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "voip_app-${{ steps.version.outputs.tag }}.apk" \
            --title "VoIP App ${{ steps.version.outputs.tag }}" \
            --generate-notes
